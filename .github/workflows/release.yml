name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-nsis
      - uses: oven-sh/setup-bun@v2
      - name: Sync versions to the tag
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/sync_version.js
      - name: Install front end dependencies (Svelte 5 + Vite)
        run: bun install --frozen-lockfile
        working-directory: ui
      - name: Bundle front end
        run: bun run build
        working-directory: ui
      - name: Build NSIS installer
        run: bun x @tauri-apps/cli@^2 build --config crates/notation-tauri/tauri.conf.json --bundles nsis
      - name: Stage artifacts
        shell: bash
        run: |
          ls target/release/bundle/nsis/
          SETUP=$(ls target/release/bundle/nsis/Notation10_*_x64-setup.exe | head -1)
          cp "$SETUP" stage-setup.exe
          sha256sum stage-setup.exe | awk '{print $1"  '$(basename "$SETUP")'"}' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Compose latest.json (updater manifest)
        shell: bash
        run: |
          SETUP=$(ls target/release/bundle/nsis/Notation10_*_x64-setup.exe | head -1)
          NAME=$(basename "$SETUP")
          SHA=$(awk '{print $1}' SHA256SUMS.txt)
          SIZE=$(stat -c %s "$SETUP")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          cat > latest.json <<EOF
          {
            "version": "${TAG}",
            "notes": "Notation10 ${TAG}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "url": "${URL}",
                "sha256": "${SHA}",
                "size": ${SIZE}
              }
            }
          }
          EOF
          cp "target/release/bundle/nsis/$NAME" .
          cat latest.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: |
            Notation10_*_x64-setup.exe
            SHA256SUMS.txt
            latest.json

  publish:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt || true
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Notation10 $TAG" \
            --generate-notes \
            --verify-tag \
            dist/Notation10_*_x64-setup.exe dist/SHA256SUMS.txt dist/latest.json
