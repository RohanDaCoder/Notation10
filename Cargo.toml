[workspace]
resolver = "2"
members = [
    "crates/notation-core",
    "crates/notation-ipc",
    "crates/notation-storage",
    "crates/notation-tauri",
    "crates/notation-ui",
    "crates/notation-updater",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/RohanDaCoder/Notation10"
authors = ["RohanDaCoder <102975537+RohanDaCoder@users.noreply.github.com>"]

[workspace.dependencies]
notation-core = { path = "crates/notation-core" }
notation-ipc = { path = "crates/notation-ipc" }
notation-storage = { path = "crates/notation-storage" }
notation-ui = { path = "crates/notation-ui" }
notation-updater = { path = "crates/notation-updater" }

tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "9"
dirs = "7"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
ureq = "3"
base64 = "0.23"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
